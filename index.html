<!DOCTYPE HTML>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0' >
    <title>AB2E Web Loader</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: Arial, sans-serif;
        background: #1a1a1a;
        color: #fff;
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      #topBar {
		background: #2a2a2a;
		padding: 5px;
		display: flex;
		align-items: center;
		gap: 5px;
		flex-shrink: 0;
		flex-wrap: wrap;
      }
      
      .btn {
        background: #4CAF50;
        color: white;
        border: none;
        padding: 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.3s;
      }
      
      .btn:hover {
        background: #45a049;
      }
      
      .btn.secondary {
        background: #555;
      } 
      
      .btn.secondary:hover {
        background: #666;
      }
      
      .mode-btn {
        background: #444;
        position: relative;
      }
      
      .mode-btn.active {
        background: #2196F3;
      }
      
      .mode-btn.active:hover {
        background: #1976D2;
      }

      #modeIndicator {
        margin-left: auto;
        background: #333;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      
      .mode-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
      }
      
      .mode-dot.pan { background: #FF9800; }
      .mode-dot.touch { background: #9C27B0; }
      .mode-dot.grab { background: #4CAF50; }
      
      #sceneInfo {
        margin-left: auto;
        color: #aaa;
        font-size: 14px;
      }
      
      #mainContainer {
        flex: 1;
        display: flex;
        overflow: hidden;
        position: relative;
      }
      
      .scene-item {
        padding: 10px;
        margin: 5px 0;
        background: #333;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.2s;
      }
      
      .scene-item:hover {
        background: #444;
      }
      
      .scene-item.active {
        background: #4CAF50;
        color: white;
      }
      
      #canvasContainer {
        flex: 1;
        position: relative;
        overflow: hidden;
      }
      
      #myCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
    
      .control-group {
        margin-bottom: 10px;
      }
      
      .control-group label {
        display: block;
        font-size: 12px;
        color: #aaa;
        margin-bottom: 5px;
      }
      
      #helpPanel {
        position: absolute;
        bottom: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.8);
        padding: 15px;
        border-radius: 8px;
        font-size: 12px;
        max-width: 250px;
        display: none;
      }
      
      #helpPanel.active {
        display: block;
      }
      
      .help-title {
        color: #4CAF50;
        margin-bottom: 8px;
        font-weight: bold;
      }
      
      .help-item {
        margin: 4px 0;
        display: flex;
        justify-content: space-between;
      }
      
      .help-key {
        color: #2196F3;
      }
    </style>
  </head>
  <body>
	<div id="topBar">
	  <button id="loadSceneBtn" class="btn">Load</button>
	  <button id="reloadSceneBtn" class="btn secondary" disabled>Reload</button>
	  <button id="resetViewBtn" class="btn secondary">Reset</button>
	  
	  <div class="separator"></div>
	  
	  <div class="mode-group">
		<button id="modePanBtn" class="btn mode-btn">Pan</button>
		<button id="modeTouchBtn" class="btn mode-btn">Touch</button>
		<button id="modeGrabBtn" class="btn mode-btn active">Grab</button>
	  </div>
	  
	  <div class="separator"></div>
	  
	  <div class="mode-group">
		<button id="renderClassicBtn" class="btn secondary" data-shortcut="C">Classic</button>
		<button id="renderWireframeBtn" class="btn secondary" data-shortcut="W">Wireframe</button>
		<button id="renderModernBtn" class="btn secondary" data-shortcut="M">Modern</button>
		<button id="renderDetailedBtn" class="btn secondary" data-shortcut="D">Detailed</button>
	  </div>
	</div>
    
    <div id="mainContainer">
      <div id="canvasContainer">
        <canvas id="myCanvas"></canvas>
      </div>
    </div>
    
    <div id="helpPanel">
      <div class="help-title">Controls</div>
      <div class="help-item">
        <span>Pan Mode:</span>
        <span class="help-key">1</span>
      </div>
      <div class="help-item">
        <span>Touch Mode:</span>
        <span class="help-key">2</span>
      </div>
      <div class="help-item">
        <span>Grab Mode:</span>
        <span class="help-key">3</span>
      </div>
      <div class="help-item">
        <span>Toggle Help:</span>
        <span class="help-key">H</span>
      </div>
      <div class="help-item">
        <span>Auto-follow:</span>
        <span class="help-key">F</span>
      </div>
      <div class="help-item">
        <span>Zoom In:</span>
        <span class="help-key">Z</span>
      </div>
      <div class="help-item">
        <span>Zoom Out:</span>
        <span class="help-key">X</span>
      </div>
      <div class="help-item">
        <span>Reset View:</span>
        <span class="help-key">R</span>
      </div>
    </div>
    
    <script src="lib/box2d.min.js"></script>
    <script src="lib/debugDraw.js"></script>
    <script src="lib/box2d-helper.js"></script>
    <script src="lib/b2Loader.js"></script>
    <script src="lib/scn2.js"></script>
    <script src="draw.js"></script>
    <script src="main.js"></script>
  </body>
</html>
